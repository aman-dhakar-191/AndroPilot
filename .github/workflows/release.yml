name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "How much to raise the last released version"
        type: choice
        required: false
        default: auto
        options: [auto, patch, minor, major]
      version:
        description: "Exact version, without the leading v. Leave empty to use the bump above."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because the version is derived from the tags and the commits since
      # the last one. A shallow clone has neither.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # android-actions/setup-android is not used: it installs the retired `tools` package
      # and fails outright. The ubuntu runners already ship an Android SDK, so the only thing
      # needed is the specific platform and build-tools this project compiles against.
      - name: Prepare the Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          # The runners version the cmdline-tools directory (16.0, latest, ...), so locate
          # sdkmanager rather than assuming a path.
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort | tail -1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      # Signs with a real key when the repository provides one, and falls back to the
      # checked-in development key when it does not.
      #
      # Both workflows use identical logic on purpose: an APK from CI and an APK from a
      # release signed with different keys cannot replace each other, which surfaces to a
      # user as "App not installed as package conflicts with an existing package".
      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROPILOT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROPILOT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROPILOT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROPILOT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "ANDROPILOT_KEYSTORE=$RUNNER_TEMP/release.keystore"
              echo "ANDROPILOT_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ANDROPILOT_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROPILOT_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing with the repository's release key."
          else
            echo "No ANDROPILOT_KEYSTORE_BASE64 secret; using the checked-in development key."
          fi

      # Works out what to call this release so a human does not have to.
      #
      # A tag push still wins outright -- the tag IS the version, and second-guessing it
      # would make the two entry points disagree. Everything below is for the manual run.
      #
      # The default is a patch bump, and that default carries the weight here: this
      # project's commit subjects are imperative prose by design ("Fix the manifest
      # comment"), not conventional-commit prefixes, so there is nothing in a normal commit
      # to infer a major or a minor from. Rather than pretend otherwise, a release that is
      # more than a patch says so explicitly -- either with the dropdown on the run, or with
      # a `Release: minor` / `Release: major` trailer in the commit that earned it, which is
      # the honest place to record it because that is where the reason lives.
      #
      # Inputs travel through env rather than ${{ }} interpolation: a free-text input
      # pasted straight into a shell script is a command injection waiting for the day
      # somebody else can press the button.
      - name: Resolve the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          if [ "$EVENT" != "workflow_dispatch" ]; then
            V="${GITHUB_REF_NAME#v}"
          elif [ -n "${INPUT_VERSION:-}" ]; then
            V="${INPUT_VERSION#v}"
          else
            LAST="$(git tag --list 'v*' --sort=-v:refname | head -1)"
            if [ -z "$LAST" ]; then
              V="0.0.1"
              echo "No previous tag; starting at $V."
            else
              BASE="${LAST#v}"
              BASE="${BASE%%-*}"
              MAJOR="$(echo "$BASE" | cut -d. -f1)"
              MINOR="$(echo "$BASE" | cut -d. -f2)"
              PATCH="$(echo "$BASE" | cut -d. -f3)"

              BUMP="${INPUT_BUMP:-auto}"
              if [ "$BUMP" = "auto" ]; then
                MESSAGES="$(git log --format='%B' "$LAST..HEAD")"
                if echo "$MESSAGES" | grep -qiE '^[[:space:]]*(Release:[[:space:]]*major|BREAKING CHANGE)'; then
                  BUMP=major
                elif echo "$MESSAGES" | grep -qiE '^[[:space:]]*Release:[[:space:]]*minor'; then
                  BUMP=minor
                else
                  BUMP=patch
                fi
                echo "Nothing asked for more, so: $BUMP."
              fi

              case "$BUMP" in
                major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
                minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
                patch) PATCH=$((PATCH + 1)) ;;
                *) echo "::error::Unknown bump '$BUMP'."; exit 1 ;;
              esac
              V="$MAJOR.$MINOR.$PATCH"
              echo "$LAST -> v$V ($BUMP, from $(git rev-list --count "$LAST..HEAD") commits)."
            fi
          fi

          # minor and patch are packed into one versionCode as major*10000 + minor*100 +
          # patch, so either reaching 100 would make a newer build look older and the in-app
          # update would silently never be offered. Fail here instead, loudly.
          MINOR_CHECK="$(echo "$V" | cut -d. -f2)"
          PATCH_CHECK="$(echo "$V" | cut -d. -f3 | cut -d- -f1)"
          if [ "$MINOR_CHECK" -ge 100 ] || [ "$PATCH_CHECK" -ge 100 ]; then
            echo "::error::$V breaks the versionCode packing (minor and patch must stay below 100)."
            exit 1
          fi

          # An existing tag would fail the publish step much later and far less clearly.
          if git rev-parse "v$V" >/dev/null 2>&1; then
            echo "::error::v$V already exists. Pass an explicit version, or bump further."
            exit 1
          fi

          echo "value=$V" >> "$GITHUB_OUTPUT"
          echo "Releasing $V."

      # The version is passed to EVERY Gradle invocation in this job, not just the one that
      # builds the artifacts. `test` also produces core/build/libs/andropilot-core-<v>.jar,
      # so running it at the default version leaves a second, wrongly-named jar behind that
      # the collect step then cannot tell apart from the real one.
      - name: Test
        run: |
          ./gradlew \
            -Pandropilot.version=${{ steps.version.outputs.value }} \
            :andropilot-core:test \
            :andropilot-protocol:test \
            :andropilot-telemetry:test \
            :andropilot-host:test --stacktrace

      - name: Test the Android modules
        run: |
          ./gradlew \
            -Pandropilot.version=${{ steps.version.outputs.value }} \
            :andropilot-devtools:testDebugUnitTest --stacktrace

      - name: Build the release artifacts
        run: |
          ./gradlew \
            -Pandropilot.version=${{ steps.version.outputs.value }} \
            :andropilot-core:jar \
            :andropilot-protocol:jar \
            :andropilot-telemetry:jar \
            :andropilot-host:distZip \
            :andropilot-android:assembleRelease \
            :andropilot-devtools:assembleRelease \
            :demo:assembleRelease \
            :andropilot-agent:assembleRelease \
            --stacktrace

      - name: Publish to the local Maven repository
        run: |
          ./gradlew \
            -Pandropilot.version=${{ steps.version.outputs.value }} \
            publishToMavenLocal --stacktrace

      - name: Collect the artifacts
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.value }}"
          mkdir -p dist
          # Named explicitly rather than globbed. build/libs accumulates an artifact per
          # Gradle invocation, so a glob attaches whatever strays are lying around; and
          # `set -e` with no `|| true` means a missing artifact fails the job instead of
          # quietly publishing a release with nothing in it.
          cp "core/build/libs/andropilot-core-$V.jar" "dist/andropilot-core-$V.jar"
          cp "android/build/outputs/aar/andropilot-android-release.aar" "dist/andropilot-android-$V.aar"
          cp "devtools/build/outputs/aar/andropilot-devtools-release.aar" "dist/andropilot-devtools-$V.aar"
          cp "protocol/build/libs/andropilot-protocol-$V.jar" "dist/andropilot-protocol-$V.jar"
          cp "telemetry/build/libs/andropilot-telemetry-$V.jar" "dist/andropilot-telemetry-$V.jar"
          cp "host/build/distributions/andropilot-host-$V.zip" "dist/andropilot-host-$V.zip"
          cp "demo/build/outputs/apk/release/demo-release.apk" "dist/andropilot-demo-$V.apk"
          # andropilot-agent-release.apk, not agent-release.apk: AGP names the output after
          # the GRADLE PROJECT name, not the directory. The project is :andropilot-agent in a
          # folder called agent/, the same split as :andropilot-android in android/ two lines
          # up. :demo is the odd one out only because its project name really is "demo".
          cp "agent/build/outputs/apk/release/andropilot-agent-release.apk" "dist/andropilot-agent-$V.apk"
          echo "Release artifacts:"
          ls -la dist

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', steps.version.outputs.value) || github.ref_name }}
          name: AndroPilot ${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: dist/*
          body: |
            AndroPilot ${{ steps.version.outputs.value }} — an AI-agnostic Android control
            and perception SDK for AI agents.

            **Artifacts**
            - `andropilot-core-*.jar` — the pure-Kotlin perception, matching and action
              layer. No Android dependency; usable in JVM tests and in a remote agent host.
            - `andropilot-android-*.aar` — the AccessibilityService-backed driver.
            - `andropilot-devtools-*.aar` — optional sideload updater. Separate on purpose:
              it needs network access and, in the consuming app, an install permission that
              the SDK itself never requests.
            - `andropilot-protocol-*.jar` — the frame format and WebSocket implementation
              shared by the agent app and the host.
            - `andropilot-telemetry-*.jar` — optional event sink that ships records to a
              server you run. Separate from the SDK, which has no network code at all, and
              it withholds screen text unless you turn that on.
            - `andropilot-host-*.zip` — the desktop host: the bridge your phone dials into
              and an MCP server in front of it.
            - `andropilot-demo-*.apk` — the inspector app, for validating the SDK on a
              device. Debug-signed; not for distribution.
            - `andropilot-agent-*.apk` — the agent app: connects the device to a host you
              configure, so a model running on your own machine can drive it.

            See `docs/INTEGRATION.md` for how to wire this into an app.
