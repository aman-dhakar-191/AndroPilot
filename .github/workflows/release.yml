name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # android-actions/setup-android is not used: it installs the retired `tools` package
      # and fails outright. The ubuntu runners already ship an Android SDK, so the only thing
      # needed is the specific platform and build-tools this project compiles against.
      - name: Prepare the Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          # The runners version the cmdline-tools directory (16.0, latest, ...), so locate
          # sdkmanager rather than assuming a path.
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort | tail -1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: ./gradlew :andropilot-core:test --stacktrace

      - name: Build the release artifacts
        run: |
          ./gradlew \
            -Pandropilot.version=${{ steps.version.outputs.value }} \
            :andropilot-core:jar \
            :andropilot-android:assembleRelease \
            :demo:assembleRelease \
            --stacktrace

      - name: Publish to the local Maven repository
        run: |
          ./gradlew \
            -Pandropilot.version=${{ steps.version.outputs.value }} \
            publishToMavenLocal --stacktrace

      - name: Collect the artifacts
        run: |
          mkdir -p dist
          cp core/build/libs/*.jar dist/ 2>/dev/null || true
          cp android/build/outputs/aar/*.aar dist/ 2>/dev/null || true
          cp demo/build/outputs/apk/release/*.apk dist/ 2>/dev/null || true
          ls -la dist

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', steps.version.outputs.value) || github.ref_name }}
          name: AndroPilot ${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: dist/*
          body: |
            AndroPilot ${{ steps.version.outputs.value }} — an AI-agnostic Android control
            and perception SDK for AI agents.

            **Artifacts**
            - `andropilot-core-*.jar` — the pure-Kotlin perception, matching and action
              layer. No Android dependency; usable in JVM tests and in a remote agent host.
            - `andropilot-android-*.aar` — the AccessibilityService-backed driver.
            - `andropilot-demo-*.apk` — the inspector app, for validating the SDK on a
              device. Debug-signed; not for distribution.

            See `docs/INTEGRATION.md` for how to wire this into an app.
