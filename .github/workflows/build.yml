name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  xml:
    name: XML well-formedness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Seconds, not minutes. An XML comment containing "--" is illegal, and the manifest
      # merger only reports it several minutes into a Gradle run, after the SDK has been
      # provisioned and the Kotlin compiler has started.
      - name: Check every manifest and resource parses
        run: |
          python3 - <<'PY'
          import glob, sys, xml.dom.minidom
          bad = 0
          for f in sorted(glob.glob("**/src/**/*.xml", recursive=True)):
              try:
                  xml.dom.minidom.parse(f)
                  print("ok  ", f)
              except Exception as e:
                  bad = 1
                  print("FAIL", f, e)
          sys.exit(bad)
          PY

  jvm:
    name: JVM modules (no Android SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # ANDROID_HOME is unset here on purpose: this job proves these modules build and their
      # whole test suites run with no Android SDK present, which is the property that keeps
      # the SDK's logic testable off-device.
      #
      # Protocol, telemetry and host are pure Kotlin for that same reason. The WebSocket
      # tests run a real client against a real server on loopback, so the framing is
      # covered by bytes crossing a socket rather than by a mock.
      - name: Build and test the JVM modules
        env:
          ANDROID_HOME: ""
          ANDROID_SDK_ROOT: ""
        run: |
          ./gradlew \
            :andropilot-core:build \
            :andropilot-protocol:build \
            :andropilot-telemetry:build \
            :andropilot-host:build --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-reports
          path: |
            core/build/reports/tests/test
            protocol/build/reports/tests/test
            telemetry/build/reports/tests/test
            host/build/reports/tests/test
          if-no-files-found: ignore

  android:
    name: Android library and demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # android-actions/setup-android is not used: it installs the retired `tools` package
      # and fails outright. The ubuntu runners already ship an Android SDK, so the only thing
      # needed is the specific platform and build-tools this project compiles against.
      - name: Prepare the Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          # The runners version the cmdline-tools directory (16.0, latest, ...), so locate
          # sdkmanager rather than assuming a path.
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort | tail -1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      # Signs with a real key when the repository provides one, and falls back to the
      # checked-in development key when it does not.
      #
      # Both workflows use identical logic on purpose: an APK from CI and an APK from a
      # release signed with different keys cannot replace each other, which surfaces to a
      # user as "App not installed as package conflicts with an existing package".
      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROPILOT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROPILOT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROPILOT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROPILOT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "ANDROPILOT_KEYSTORE=$RUNNER_TEMP/release.keystore"
              echo "ANDROPILOT_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ANDROPILOT_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROPILOT_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing with the repository's release key."
          else
            echo "No ANDROPILOT_KEYSTORE_BASE64 secret; using the checked-in development key."
          fi

      - name: Assemble the library and the demo app
        run: |
          ./gradlew \
            :andropilot-android:assembleRelease \
            :andropilot-devtools:assembleRelease \
            :demo:assembleRelease \
            :andropilot-agent:assembleRelease \
            :andropilot-updater:assembleRelease --stacktrace

      # Runs here rather than in the JVM job because :andropilot-devtools is an Android
      # library and needs the SDK to configure at all. The logic under test is pure -- which
      # APK on a release belongs to this app -- and it got that wrong in production once.
      # A test task that discovers nothing succeeds and looks exactly like one that passed.
      # JUnit 5 under AGP's unit test task is the sort of wiring that breaks quietly, so the
      # count is asserted rather than assumed.
      - name: Unit-test the devtools module
        run: |
          set -euo pipefail
          ./gradlew :andropilot-devtools:testDebugUnitTest --stacktrace

          results="devtools/build/test-results/testDebugUnitTest"
          # `|| true` matters: with pipefail, grep finding nothing would abort the step
          # before the message below -- which is precisely the case worth explaining.
          count="$({ grep -ho 'tests="[0-9]\+"' "$results"/TEST-*.xml 2>/dev/null || true; } \
            | tr -dc '0-9\n' | awk '{ sum += $1 } END { print sum + 0 }')"
          echo "Ran ${count} test(s) from $results"
          if [ "${count}" -eq 0 ]; then
            echo "::error::No tests were discovered; the task passed without running anything."
            exit 1
          fi

      - name: Lint
        run: ./gradlew :andropilot-android:lintRelease :andropilot-devtools:lintRelease --stacktrace

      - name: Upload the demo APK
        uses: actions/upload-artifact@v4
        with:
          name: andropilot-demo-apk
          path: demo/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Named rather than globbed, so this job proves the filename the release workflow
      # copies. A glob here is what let `agent-release.apk` reach a release run and fail
      # it: the upload passed on whatever was there while the release job expected a name
      # AGP never produces. With `if-no-files-found: error`, a rename now fails on the PR.
      - name: Upload the agent APK
        uses: actions/upload-artifact@v4
        with:
          name: andropilot-agent-apk
          path: agent/build/outputs/apk/release/andropilot-agent-release.apk
          if-no-files-found: error

      - name: Upload the updater APK
        uses: actions/upload-artifact@v4
        with:
          name: andropilot-updater-apk
          path: updater/build/outputs/apk/release/andropilot-updater-release.apk
          if-no-files-found: error

      - name: Upload the library AAR
        uses: actions/upload-artifact@v4
        with:
          name: andropilot-aars
          path: |
            android/build/outputs/aar/*.aar
            devtools/build/outputs/aar/*.aar
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: android/build/reports/lint-results-release.html
          if-no-files-found: ignore

      - name: Upload the devtools test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devtools-test-report
          path: devtools/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
