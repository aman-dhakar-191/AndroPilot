<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AndroPilot</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfd; --panel: #fff; --line: #e3e3ea; --text: #1a1a1f;
    --dim: #6b6b76; --accent: #5b4bd6; --ok: #1d7a44; --bad: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#131317; --panel:#1b1b21; --line:#2d2d36; --text:#e9e9ee;
            --dim:#9a9aa6; --accent:#9d8dfb; --ok:#5ed68f; --bad:#ff8a80; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--dim); font-size: 13px; margin: 0 0 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
  .dot.on { background: var(--ok); }
  input[type=text] {
    flex: 1 1 260px; min-width: 0; padding: 10px 12px; font: inherit;
    color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 9px;
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    padding: 10px 16px; font: inherit; font-weight: 550; cursor: pointer;
    border-radius: 9px; border: 1px solid transparent; background: var(--accent); color: #fff;
  }
  button.ghost { background: transparent; color: var(--text); border-color: var(--line); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #log { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
  .ev { border: 1px solid var(--line); border-left-width: 3px; border-radius: 10px;
        padding: 10px 12px; background: var(--panel); }
  .ev .k { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }
  .ev pre { margin: 6px 0 0; white-space: pre-wrap; word-break: break-word;
            font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .intent { border-left-color: var(--accent); }
  .action { border-left-color: var(--dim); }
  .result { border-left-color: var(--ok); }
  .result.bad { border-left-color: var(--bad); }
  .finished { border-left-color: var(--ok); }
  .failed, .halted { border-left-color: var(--bad); }
  .empty { color: var(--dim); font-size: 13px; padding: 24px 0; text-align: center; }
  .picker { position: relative; flex: 1 1 260px; min-width: 0; }
  .picker input { width: 100%; }
  .menu {
    position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; right: 0;
    max-height: 300px; overflow-y: auto; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; padding: 4px;
    box-shadow: 0 12px 28px rgba(0,0,0,.22);
  }
  .menu[hidden] { display: none; }
  .menu .grp {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em;
    color: var(--dim); padding: 8px 10px 4px;
  }
  .opt {
    padding: 7px 10px; border-radius: 7px; cursor: pointer;
    font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .opt:hover, .opt.active { background: var(--accent); color: #fff; }
  .menu .none { padding: 10px; color: var(--dim); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>AndroPilot</h1>
  <p class="sub">Give the phone something to do, and watch it work.</p>

  <div class="card">
    <div class="row" style="margin-bottom:12px">
      <span class="dot" id="dot"></span>
      <span id="device">Checking for a device…</span>
    </div>
    <div class="row" style="margin-bottom:8px">
      <div class="picker">
        <input type="text" id="model" placeholder="Model or combo name" autocomplete="off"
               role="combobox" aria-expanded="false" aria-autocomplete="list"
               title="What the host asks the endpoint for. Type to search what it offers.">
        <div class="menu" id="menu" role="listbox" hidden></div>
      </div>
      <button id="refresh" class="ghost" title="Re-read what the endpoint offers">&#8635;</button>
    </div>
    <p class="sub" id="modelNote" style="margin:0 0 10px"></p>
    <div class="row">
      <input type="text" id="goal" placeholder="Turn on Wi-Fi" autocomplete="off">
      <button id="start">Run</button>
      <button id="stop" class="ghost" disabled>Stop</button>
    </div>
  </div>

  <div id="log"><p class="empty">Nothing yet.</p></div>
</main>

<script>
  const log = document.getElementById('log');
  const goal = document.getElementById('goal');
  const start = document.getElementById('start');
  const stop = document.getElementById('stop');
  const dot = document.getElementById('dot');
  const model = document.getElementById('model');
  const menu = document.getElementById('menu');
  const modelNote = document.getElementById('modelNote');
  const refresh = document.getElementById('refresh');
  const device = document.getElementById('device');
  let running = false;

  function setRunning(on) {
    running = on;
    start.disabled = on;
    stop.disabled = !on;
    start.textContent = on ? 'Running…' : 'Run';
  }

  function add(kind, label, body, extra) {
    if (log.firstElementChild && log.firstElementChild.className === 'empty') log.innerHTML = '';
    const el = document.createElement('div');
    el.className = 'ev ' + kind + (extra || '');
    const k = document.createElement('div');
    k.className = 'k';
    k.textContent = label;
    el.appendChild(k);
    if (body) {
      const pre = document.createElement('pre');
      pre.textContent = body;
      el.appendChild(pre);
    }
    log.appendChild(el);
    el.scrollIntoView({ block: 'nearest' });
  }

  // The endpoint is the only thing that knows what names it answers to: a gateway routes
  // on a string that may name a model or a group somebody created in its dashboard, and
  // guessing the spelling costs one failed run per attempt.
  //
  // A hand-built list rather than <datalist>: the native one is a browser-styled popup that
  // shows a handful of a hundred entries, cannot be grouped, and gives no way to say that a
  // typed name is not among them -- which is the single most useful thing this can tell you.
  let known = [];
  let shown = [];
  let active = -1;

  function note(text) { modelNote.textContent = text; }

  function describe() {
    const value = model.value.trim();
    if (!known.length) {
      note('The endpoint did not list anything. A name typed here is still sent as-is.');
      return;
    }
    const combos = known.filter((o) => o.group === 'combo' && !o.id.startsWith('combo/')).length;
    const models = known.filter((o) => o.group === 'model').length;
    const counts = `${models} model${models === 1 ? '' : 's'}`
      + (combos ? `, ${combos} combo${combos === 1 ? '' : 's'}` : ', no combos');
    if (value && !known.some((o) => o.id === value)) {
      note(`\u26a0 \u201c${value}\u201d is not among them (${counts}). The endpoint will refuse it.`);
    } else {
      note(counts + '. Pick one, or leave it for the host\u2019s configured default.');
    }
  }

  function closeMenu() {
    menu.hidden = true;
    model.setAttribute('aria-expanded', 'false');
    active = -1;
  }

  function openMenu() {
    const query = model.value.trim().toLowerCase();
    shown = known.filter((o) => o.id.toLowerCase().includes(query));
    menu.innerHTML = '';
    if (!shown.length) {
      const none = document.createElement('div');
      none.className = 'none';
      none.textContent = known.length ? 'Nothing matches. It will be sent as typed.' : 'Nothing to choose from.';
      menu.appendChild(none);
    } else {
      let group = null;
      shown.forEach((option, i) => {
        if (option.group !== group) {
          group = option.group;
          const head = document.createElement('div');
          head.className = 'grp';
          head.textContent = group === 'combo' ? 'Combos' : 'Models';
          menu.appendChild(head);
        }
        const el = document.createElement('div');
        el.className = 'opt';
        el.setAttribute('role', 'option');
        el.textContent = option.id;
        el.dataset.index = i;
        // mousedown, not click: blur would close the menu before a click landed.
        el.addEventListener('mousedown', (e) => {
          e.preventDefault();
          model.value = option.id;
          closeMenu();
          describe();
        });
        menu.appendChild(el);
      });
    }
    menu.hidden = false;
    model.setAttribute('aria-expanded', 'true');
  }

  function highlight(delta) {
    const items = [...menu.querySelectorAll('.opt')];
    if (!items.length) return;
    if (active >= 0 && items[active]) items[active].classList.remove('active');
    active = (active + delta + items.length) % items.length;
    items[active].classList.add('active');
    items[active].scrollIntoView({ block: 'nearest' });
  }

  async function loadModels() {
    note('Reading what the endpoint offers\u2026');
    try {
      const res = await fetch('/models');
      const data = await res.json();
      known = data.models || [];
      if (!model.value && data.selected) model.value = data.selected;
      describe();
    } catch (e) {
      note('Could not reach the endpoint for a list.');
    }
  }

  model.addEventListener('focus', openMenu);
  model.addEventListener('input', () => { openMenu(); describe(); });
  model.addEventListener('blur', () => { closeMenu(); describe(); });
  model.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (menu.hidden) openMenu();
      highlight(e.key === 'ArrowDown' ? 1 : -1);
    } else if (e.key === 'Enter') {
      const items = [...menu.querySelectorAll('.opt')];
      if (!menu.hidden && active >= 0 && items[active]) {
        e.preventDefault();
        model.value = items[active].textContent;
        closeMenu();
        describe();
      }
    } else if (e.key === 'Escape') {
      closeMenu();
    }
  });
  refresh.onclick = loadModels;
  loadModels();

  const stream = new EventSource('/events');
  stream.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    switch (ev.type) {
      case 'device':
        dot.className = 'dot' + (ev.connected ? ' on' : '');
        device.textContent = ev.connected
          ? `${ev.name || 'Device'} connected · ${ev.tools} tools`
          : 'No device connected. Open the AndroPilot agent app and connect it.';
        break;
      case 'started':
        setRunning(true);
        add('intent', 'goal', ev.goal + '\n' + ev.model);
        break;
      case 'intent': add('intent', 'step ' + ev.step, ev.text); break;
      case 'action': add('action', ev.name, ev.payload); break;
      case 'result': add('result', ev.name + ' result', ev.summary, ev.ok ? '' : ' bad'); break;
      case 'finished':
        setRunning(false);
        add('finished', `done · ${ev.steps} steps · ${ev.actions} actions`, ev.message || '');
        break;
      case 'halted':
        setRunning(false);
        add('halted', `stopped · ${ev.actions} actions`, ev.reason);
        break;
      case 'failed':
        setRunning(false);
        add('failed', 'failed', ev.message);
        break;
    }
  };

  async function post(path, body) {
    const res = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {}),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      add('failed', 'refused', data.error || ('HTTP ' + res.status));
      setRunning(false);
    }
  }

  start.onclick = () => {
    const text = goal.value.trim();
    if (!text) return;
    setRunning(true);
    post('/run', { goal: text, model: model.value.trim() });
  };
  stop.onclick = () => post('/stop');
  goal.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !running) start.click(); });
</script>
</body>
</html>
